name: Character and Component Regression

on:
  pull_request:
    paths:
      - 'beys/**'
      - 'avatars/**'
      - 'parts/**'
      - 'utils/**'
      - 'cogs/avatar/**'
      - 'cogs/battle/session.py'
      - 'cogs/battle/**'
      - 'cogs/abilities/**'
      - 'cogs/story/story_ai.py'
      - 'cogs/economy/**'
      - 'cogs/ui/inventory_ui.py'
      - 'cogs/extras/trade.py'
      - 'cogs/battle/boss/boss_battle.py'
      - 'tools/**'
      - 'docs/*baseline.json'
      - '.github/workflows/character-components.yml'

jobs:
  isolated-regressions:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: avatar-test
          MYSQL_DATABASE: avatar_v4_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pavatar-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'discord.py>=2.6' python-dotenv pillow playwright 'PyMySQL[rsa]==1.1.1'
      - name: Migration, equipment and SQLite restart
        run: |
          python -m unittest tools.test_character_components
          python -m unittest tools.test_physical_components
      - name: PvP, Boss, Story, inventory controls and battle snapshots
        run: python tools/test_component_battles.py
      - name: Startup registration without a Discord login
        env:
          BEYCORD_AUTO_INSTALL: '0'
          BEYCORD_AUTO_UPDATE: '0'
        run: python -m unittest tools.test_character_startup
      - name: Existing Avatar and ability execution
        run: |
          python -m unittest tools.test_october_bey_roster
          python -m unittest tools.test_dragon_killer_black_legend
          python tools/test_avatar_battle_connection.py
          python tools/test_special_avatar_pipeline.py
          python tools/test_special_defense.py
          python tools/test_original_generation.py
          python tools/test_avatar_roster.py
          python -m unittest tools.test_avatar_progression
          python -m unittest tools.test_avatar_action_menu
          python -m unittest tools.test_avatar_skill_display
          python tools/test_draciel.py
          python -m unittest tools.test_dranzer
          python -m unittest tools.test_boss_flow
      - name: Avatar V4 SQLite and live MySQL progression/rewards
        env:
          AVATAR_V4_TEST_MYSQL_URL: mysql://root:avatar-test@127.0.0.1:3306/avatar_v4_test
        run: python -m unittest tools.test_avatar_progression_v4
      - name: Character info cards and effective-stat compatibility
        run: |
          python tools/test_beycbot_info_card.py
          python tools/sim_avatar_info_card.py
          python tools/sim_stats_pipeline.py
      - name: Deployment paths, snapshot compatibility and syntax
        run: |
          python tools/sim_updater_paths.py
          python tools/sim_snapshots.py
          python -m compileall -q utils cogs tools
